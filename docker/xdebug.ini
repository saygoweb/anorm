[xdebug]
zend_extension=xdebug

; Xdebug 3 configuration.
;
; Off by default. This container exists so host-side agents can run the suite,
; and "off" is the only mode with no interpreter overhead at all. Turn it on per
; command instead:
;
;   docker/anorm coverage                        (sets XDEBUG_MODE=coverage itself)
;   XDEBUG_MODE=debug docker/anorm php script.php
;
; XDEBUG_MODE in the environment always wins over xdebug.mode below, and
; docker-compose.yml passes the host's XDEBUG_MODE straight through.
xdebug.mode=off

; When mode is debug, only connect for requests carrying the XDEBUG_TRIGGER
; signal, so ordinary CLI runs never pay the connection-timeout cost of reaching
; for a debugger that isn't listening.
xdebug.start_with_request=trigger
xdebug.client_host=host.docker.internal
; Xdebug 3's default. The .devcontainer stack listens on 9000, so an IDE can
; watch both at once. Override without rebuilding via XDEBUG_CONFIG, e.g.
;   XDEBUG_CONFIG="client_port=9000" docker/anorm up
xdebug.client_port=9003
xdebug.discover_client_host=true

xdebug.idekey=VSCODE

; Minimal logging; raise log_level to 7 when diagnosing a connection problem.
xdebug.log=/tmp/xdebug.log
xdebug.log_level=0

xdebug.output_dir=/tmp/xdebug
