[PHP]
; Development settings. Anorm reports its own problems through error_log()
; (see Model::createForeignKey), so errors have to go somewhere the host can
; read without a docker exec.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
; Inside the bind mount, and already gitignored via /build/logs/.
error_log = /workspace/build/logs/php_errors.log

; 512M rather than the CLI default of -1 being relied on implicitly: `composer
; analyze` asks phpstan for 512M, and PHPUnit under Xdebug coverage needs the
; same order of headroom.
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; Date settings. The test suite writes dtc/dtu values and compares them, so a
; fixed zone keeps results identical to CI regardless of the host's locale.
date.timezone = "UTC"

; MySQLi defaults — the "db" service in docker-compose.yml. Anorm itself
; connects through PDO with an explicit DSN; these only help ad-hoc scripts.
mysqli.default_host = db
mysqli.default_user = dev
mysqli.default_pw = dev

allow_url_fopen = On
allow_url_include = Off

expose_php = Off
